plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/wynnchayuan.accessWidener")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // Mod Menu 的 API（只在編譯時用，見下面的 modCompileOnly）
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Wynntils 用 Mojang 官方名稱編譯，我們跟著用，才不會出現對不上的型別
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Wynntils 只發佈到 Modrinth / CurseForge，沒有任何 Maven 發佈設定，
    // 所以只能吃本機 jar。modCompileOnly 會讓 Loom 自動把 intermediary
    // 重映射成 Mojang 名稱。把 fabric 版 jar 放進 libs/ 即可。
    //
    // 不要改用 maven.modrinth:wynntils:v4.2.8 —— 看起來可行，實測是壞的：
    // Modrinth 的 fabric 與 neoforge 兩個版本共用同一個 version_number，
    // 該座標實際會抓到 NeoForge jar（已驗證：回傳的檔案含 neoforge.mods.toml
    // 而非 fabric.mod.json）。詳見 README。
    modCompileOnly fileTree(dir: 'libs', include: ['wynntils-*-fabric*.jar'])

    // Mod Menu：只拿它的介面來編譯 client.ModMenuEntry，不打包、也不要求玩家安裝。
    // 沒裝 Mod Menu 的人那個類別根本不會被載入（見該類別的說明）。
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// 少了 Wynntils jar 的話，錯誤會是一長串「找不到 com.wynntils.*」，很難看出真正原因。
// 這裡先擋下來並講清楚該做什麼。
tasks.register('checkWynntilsJar') {
    // 在設定階段就把路徑拿好：執行階段不能再碰 project（configuration cache）
    def libsDir = file('libs')
    doLast {
        def jars = (libsDir.listFiles() ?: [] as File[]).findAll {
            it.name ==~ /wynntils-.*-fabric.*\.jar/
        }
        if (jars.isEmpty()) {
            throw new GradleException(
                "libs/ 裡找不到 Wynntils 的 fabric jar。\n" +
                "請從 https://modrinth.com/mod/wynntils/versions 下載 fabric 版\n" +
                "（檔名形如 wynntils-4.2.8-fabric+MC-1.21.11.jar）放進 collector/libs/。\n" +
                "注意要 fabric 版，不是 neoforge 版。")
        }
        jars.each { jar ->
            def isFabric = new java.util.zip.ZipFile(jar).withCloseable {
                it.getEntry('fabric.mod.json') != null
            }
            if (!isFabric) {
                throw new GradleException(
                    "${jar.name} 不是 fabric jar（缺少 fabric.mod.json）。\n" +
                    "很可能誤下載成 NeoForge 版，請換成 fabric 版。")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'checkWynntilsJar' }

processResources {
    // 執行階段不能再碰 project（configuration cache），版本號先取出來
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        // escapeBackslash 一定要開。
        //
        // expand 走的是 Groovy 的樣板引擎，它會把反斜線加 n 當成「換行的
        // 跳脫」而不是兩個字元——於是 description 裡那一個跳脫在 jar 裡變成
        // 真的換行，而 JSON 的字串不能有真的換行。結果是 fabric.mod.json
        // 解析失敗、模組整個載不起來，而原始碼看起來完全正常。
        expand(["version": modVersion]) {
            it.escapeBackslash = true
        }
    }

    // 產生出來的 fabric.mod.json 一定要是合法 JSON。
    //
    // 上面那個跳脫問題是「原始碼對、產生物壞」，唯一看得到的地方就是這裡。
    // 少了這道檢查，壞掉的 jar 會一路發到 CurseForge 上才被發現——
    // 而玩家看到的是模組沒出現在列表裡，沒有任何錯誤訊息指向這個檔。
    doLast {
        def built = new File(destinationDir, 'fabric.mod.json')
        if (built.exists()) {
            try {
                new groovy.json.JsonSlurper().parseText(built.text)
            } catch (Exception e) {
                throw new GradleException(
                    "產生出來的 fabric.mod.json 不是合法 JSON：${e.message}"
                    + "　多半是 description 裡的跳脫被 expand 吃掉了，"
                    + "見上面 escapeBackslash 那段說明。")
            }
        }
    }

    // 版本說明跟著 jar 走一份。
    //
    // 線上那一份（倉庫根目錄的 version.json）是「現在最新是哪一版」的真相，
    // 但斷網的時候讀不到——而 F6 的「本版更新內容」講的是<b>手上這個 jar</b>，
    // 那件事不需要連線也該看得到。一份檔案兩個用途，來源只有一個。
    from(rootProject.file('version.json')) {
        into 'assets/wynnchayuan'
    }

    // 沒有任何字型檔引用的字型不打進 jar。
    //
    // font/ 底下放著日文與韓文兩份點陣字型，但目前沒有任何 font JSON 引用
    // 它們——沒有 ja/ko 的譯文，也就沒有東西會去載。兩份加起來 7.9MB，
    // 壓進 jar 還有 1.9MB，等於讓每個玩家為了將來也許會做的語言多下載一份。
    //
    // 判準是「有沒有人引用」而不是寫死檔名：哪天真的開了 ja，
    // 那時的 font JSON 會寫上它，這裡就自動跟著打包。
    def fontDir = file('src/main/resources/assets/wynnchayuan/font')
    if (fontDir.exists()) {
        def referenced = new HashSet<String>()
        fontDir.eachFileRecurse { f ->
            if (f.name.endsWith('.json')) {
                (f.text =~ /wynnchayuan:([\w.-]+[.]ttf)/).each { m ->
                    referenced.add(m[1])
                }
            }
        }
        inputs.property 'referencedFonts', referenced.toSorted().join(',')
        fontDir.listFiles()?.each { f ->
            if (f.name.endsWith('.ttf') && !referenced.contains(f.name)) {
                exclude "assets/wynnchayuan/font/${f.name}"
                logger.lifecycle(
                    "[WynnChaYuan] ${f.name} 沒有字型檔引用，不打進 jar")
            }
        }
    }

    // 一條譯文都沒有的語言不打進 jar。
    //
    // 新語言剛開的時候是一份空骨架：結構完整、原文齊全、譯文全空。那是給
    // 翻譯的人用的，從 repo 拿就好；打進 jar 對玩家沒有任何用處，卻要他
    // 多下載一份完整的原文——實測三種空語言讓 jar 從 3.0MB 變成 9.5MB。
    //
    // 要打哪幾種以 _languages.json 為準，那份由 tools/update-docs.py 產生，
    // 只列有譯文的語言。這裡不自己再判斷一次：兩邊各判一次，遲早會出現
    // 「清單說有、jar 裡卻沒有」那種很難查的狀況。
    def manifest = file(
        'src/main/resources/assets/wynnchayuan/translations/_languages.json')
    if (manifest.exists()) {
        def parsed = new groovy.json.JsonSlurper().parse(manifest)
        def shipped = parsed['languages'] as Set
        def empty = (parsed['empty'] ?: [:]) as Map
        inputs.property 'shippedLanguages', shipped.toSorted().join(',')
        inputs.property 'emptyFiles', empty.toString()
        def root = file('src/main/resources/assets/wynnchayuan/translations')
        root.listFiles()?.each { dir ->
            if (dir.directory && !shipped.contains(dir.name)) {
                exclude "assets/wynnchayuan/translations/${dir.name}/**"
                logger.lifecycle(
                    "[WynnChaYuan] ${dir.name} 還沒有譯文，不打進 jar")
            }
        }
        // 一條都還沒翻的<b>檔案</b>同樣不打。整個語言一起判斷的話，
        // 簡體中文只要翻好介面標籤，就會連同兩萬多條全空的任務對話一起
        // 被打包——jar 從 6.5MB 變成 8.6MB，而多出來的全是英文原文。
        empty.each { lang, files ->
            files.each { name ->
                exclude "assets/wynnchayuan/translations/${lang}/${name}"
            }
            if (files) {
                logger.lifecycle(
                    "[WynnChaYuan] ${lang} 有 ${files.size()} 個檔案還沒開始翻，不打進 jar")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // 程式碼 AGPLv3（LICENSE）、翻譯與資料 CC BY-NC-SA 4.0（LICENSE-DATA），兩份都跟著 jar 走
    // rename 在執行階段才跑，不能再碰 project（configuration cache），名字先取出來
    def baseName = project.archives_base_name
    from("LICENSE") {
        rename { "${it}_${baseName}" }
    }
    from("LICENSE-DATA") {
        rename { "${it}_${baseName}" }
    }
}

// 驗證程式直接沿用 main 的 classpath —— 那份已經被 Loom 重映射成 Mojang 名稱，
// 若改用未重映射的原始 jar，跑起來會是 intermediary 名稱而對不上。
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

// 沒有引入 JUnit，檢查都是有 main 的類別；停掉標準 test 任務避免 build 失敗。
tasks.named('test') { enabled = false }

// 單跑一支：gradle DialogueTypingTest
def testRoot = file('src/test/java')
def offlineChecks = fileTree(testRoot) { include '**/*Test.java' }.files
        .collect { testRoot.toPath().relativize(it.toPath()).toString().replace(File.separator, '.') - '.java' }
        .sort()

tasks.register('offlineChecks') {
    group = 'verification'
    description = '跑完 src/test/java 底下全部的 *Test'
}
tasks.named('check') { dependsOn 'offlineChecks' }

offlineChecks.each { testClass ->
    def task = tasks.register(testClass.tokenize('.').last(), JavaExec) {
        group = 'verification'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = testClass
    }
    tasks.named('offlineChecks') { dependsOn task }
}

// -PplayerFolder=<某個玩家 config/wynnchayuan 的副本>：額外拿那一份完整跑一次啟動讀檔。
// 測試會先複製到暫存資料夾再跑，不會動到指定的那一份。
tasks.named('UpgradeSafetyTest') {
    if (project.hasProperty('playerFolder')) {
        systemProperty 'wcy.playerFolder', project.property('playerFolder')
    }
}

// 排查時可以用 -PquestScope=0 模擬「沒在追蹤任務」那條路
tasks.named('DialogueTypingTest') {
    systemProperty 'wcy.questScope', findProperty('questScope') ?: '1'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs('-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8')
}

tasks.register('probeNoteColour', JavaExec) {
    group = 'verification'
    description = '括號註解在譯文裡拿到什麼顏色（診斷用）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wynnchayuan.translate.NoteColourProbe'
}

tasks.register('probeStatLabels', JavaExec) {
    group = 'verification'
    description = '看那幾行技能屬性到底查成什麼（診斷用，不判對錯）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wynnchayuan.translate.StatLabelProbe'
}


// 量表，不掛 check：台詞逐字打出來時，第一個中文之前已經打了幾個英文字元
tasks.register('runDialogueLeadAudit', JavaExec) {
    group = 'verification'
    description = '量表：對話第一個中文出現之前打了幾個英文字元（-Plang=、-Pevery=、-Psamples=true）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wynnchayuan.render.DialogueLeadAudit'
    systemProperty 'wcy.lang', findProperty('lang') ?: 'zh_tw'
    systemProperty 'wcy.every', findProperty('every') ?: '1'
    systemProperty 'wcy.samples', findProperty('samples') ?: 'false'
    systemProperty 'wcy.quest', findProperty('quest') ?: ''
    systemProperty 'wcy.dump', findProperty('dump') ?: ''
    systemProperty 'wcy.only', findProperty('only') ?: ''
    systemProperty 'wcy.msPerChar', findProperty('msPerChar') ?: '40'
    systemProperty 'wcy.variant', findProperty('variant') ?: ''
}

// mixin 套件底下只能放 mixin 本身與設定外掛。
//
// 放過一個純 helper 進去（TypedText），編譯與 build 都沒話說，實機一開背包就炸：
// 「is in a defined mixin package ... and cannot be referenced directly」。
// mixins.json 宣告的那個套件是 Mixin 的地盤，裡面的類別只能由它自己載入。
tasks.register('checkMixinPackage') {
    group = 'verification'
    description = 'mixin 套件底下不能放被直接引用的一般類別'
    def mixinsJson = file('src/main/resources/wynnchayuan.mixins.json')
    def mixinDir = file('src/main/java/com/wynnchayuan/mixin')
    doLast {
        def cfg = new groovy.json.JsonSlurper().parse(mixinsJson)
        def allowed = [] as Set
        ['client', 'server', 'mixins'].each { key ->
            (cfg[key] ?: []).each { allowed << it.toString().tokenize('.').last() }
        }
        if (cfg.plugin) {
            allowed << cfg.plugin.toString().tokenize('.').last()
        }
        def stray = mixinDir.listFiles()
                .findAll { it.name.endsWith('.java') }
                .collect { it.name - '.java' }
                .findAll { !allowed.contains(it) }
                .sort()
        if (stray) {
            throw new GradleException(
                    "這幾個類別在 mixin 套件底下，但不是 mixins.json 列的 mixin：\n  "
                    + stray.join('\n  ')
                    + "\n被 mixin 注入的程式碼引用到它們的話，實機載入時會丟"
                    + " IllegalClassLoadError。搬到別的套件（例如 render）。")
        }
    }
}
tasks.named('check') { dependsOn 'checkMixinPackage' }

tasks.register('goldenDump', JavaExec) {
    group = 'verification'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    description = '把翻譯輸出攤成逐行快照，重構前後比對用（tools/golden-diff.py）'
    mainClass = 'com.wynnchayuan.golden.TranslationGoldenDump'
    maxHeapSize = '4g'
    def out = providers.gradleProperty('golden.out')
            .orElse(layout.buildDirectory.file('golden/golden.txt').get().asFile.path).get()
    def corpus = providers.gradleProperty('golden.corpus')
            .orElse(file('src/main/resources/assets/wynnchayuan/translations').path).get()
    def samples = providers.gradleProperty('golden.samples').orElse('').get()
    args([out, corpus] + samples.tokenize(File.pathSeparator))
}

tasks.register('hotPathBench', JavaExec) {
    group = 'verification'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    description = '離線量翻譯熱路徑的 ns/op 與配置量（不在 check 裡）'
    mainClass = 'com.wynnchayuan.golden.HotPathBench'
    maxHeapSize = '4g'
    def corpus = providers.gradleProperty('bench.corpus')
            .orElse(file('src/main/resources/assets/wynnchayuan/translations').path).get()
    def samples = providers.gradleProperty('bench.samples').orElse('').get()
    def jfr = providers.gradleProperty('bench.jfr').orElse('').get()
    if (!jfr.isEmpty()) {
        jvmArgs "-XX:StartFlightRecording=filename=${jfr},settings=profile"
    }
    args([corpus] + samples.tokenize(File.pathSeparator))
}
