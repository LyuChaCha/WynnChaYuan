<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #fb7299; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #ccc; cursor: default; }
  p { color: #666; font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
  <h1>B站影片下載器</h1>
  <button id="open" disabled>開啟下載面板</button>
  <p id="hint">請在 bilibili 影片頁面（www.bilibili.com/video/…）使用。</p>
  <script src="popup.js"></script>
</body>
</html>
