# 沿用語料收集站那一支 Worker 與它的 KV：網址不變，鍵用 u:／cape:／ban: 開頭，跟舊資料不相干。
name = "wynnchayuan-corpus"
main = "worker.js"
compatibility_date = "2026-01-01"

# 自己的網域（Cloudflare 上的 wynnchayuan.com）。部署時 wrangler 會自己建好 DNS 與憑證。
# 模組連的就是這個網址；workers.dev 那個網址照樣可以用。
routes = [{ pattern = "capes.wynnchayuan.com", custom_domain = true }]

[[kv_namespaces]]
binding = "CORPUS"
id = "70fa88851cfa4cee87b3e818dc40cb75"

[vars]
# 誰可以上傳披風：
#   tiered  驗過身分的人都能傳 PNG；GIF 只有 credits.json 上的成員（開發者、贊助者、貢獻者）
#   listed  只有 credits.json 上的成員能傳
#   anyone  驗過身分的人都能傳，PNG、GIF 都可以
#   off     不收
UPLOADS = "tiered"

# ADMIN_TOKEN 不寫在這裡——它是秘密，用 wrangler secret put ADMIN_TOKEN 設定。見 README.md。
