# 譯文提交後自動檢查。
#
# 只擋機械性的錯：佔位符掉了、換行數不對、材質包符號被直接貼進譯文、
# 地名被翻掉、跨檔譯法不一致。這些無論翻得好不好都一定錯，讓機器擋掉，
# 人就可以專心看「翻得對不對」——那才是人該做的部分。
#
# 為什麼譯文用 pull_request_target
# --------------------------------
# 一般的 pull_request 事件，對「第一次貢獻的人」需要維護者手動按
# Approve and run 才會跑。實際發生的事情是：沒人按，檢查沒跑，PR 就被合併了
# ——已經因此混進兩批壞掉的譯文（佔位符與換行數不符，遊戲裡會整行放棄翻譯）。
#
# pull_request_target 不需要核准，但它拿的是<b>有寫入權的 token</b>，所以
# 絕對不能執行 PR 帶來的程式碼。這裡的做法是：
#
#   1. checkout <b>本倉庫</b>的程式（tools/validate.py 是可信的）
#   2. 只把 PR 的<b>譯文 JSON</b> 取過來當資料
#
# JSON 是資料不是程式，不會被執行。動到 tools/ 的 PR 則走一般的
# pull_request，那本來就該人工核准才跑——那是程式碼。
name: 檢查譯文

on:
  pull_request_target:
    paths:
      - 'src/main/resources/assets/wynnchayuan/translations/**'
  # 這一條刻意<b>不加路徑過濾</b>，每個 PR 都跑。
  #
  # validate 是 main 的必要檢查，而必要檢查配上路徑過濾會變成死結：只動
  # Java 的 PR 不觸發任何 workflow，檢查就永遠不會回報，PR 也就永遠合不進去
  # ——管理員也繞不過，那正是我們要的。
  #
  # 跑一次十秒。對一個「沒動到語料就不會失敗」的檢查來說完全划得來，
  # 何況只動 Java 的 PR 也該確認語料沒被順手改壞。
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/assets/wynnchayuan/translations/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 取出本倉庫的程式
        uses: actions/checkout@v4

      - name: 取出 PR 的譯文檔（只取資料，不取程式）
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr"
          git checkout pr -- src/main/resources/assets/wynnchayuan/translations/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 檢查譯文格式
        run: python tools/validate.py

      # quest/ 底下是譯者改的工作檔，遊戲讀的是合併後的 quest-dialogue.json。
      # 合併本來全交給 rebuild-quest-bundle——但那支開 PR 需要倉庫允許
      # Actions 開 PR，沒開的話它只會把產生物推到 auto/rebuild-* 分支，
      # 然後<b>刻意不變紅燈</b>。於是遠端堆了一百多個沒人合的分支，而譯者
      # 在 quest/ 補的句子一句都沒進遊戲——實機回報「翻到一半變英文」查了
      # 兩輪才發現是這個。
      #
      # 所以這裡再擋一次：合併檔沒跟上就紅燈，看得見才修得掉。
      - name: 合併檔有沒有跟著 quest/ 更新
        run: python tools/quest-bundle.py --check

      # 收集站那一道個資濾網。三道濾網各自獨立（模組端、收集站、進倉庫前），
      # 所以三邊都要有自己的測試——只要有一道擋得住就不會外流。
      # 簡體不是繁體的字元轉換。字轉了、詞沒轉的句子完全合法——JSON 沒錯、
      # 佔位符沒錯、字也都是簡體，沒有任何既有的檢查會抱怨。
      - name: 簡中有沒有繁中直譯的痕跡
        run: python tools/check-zh-cn.py

      # 忘了改 version.json 不會壞任何東西——只是玩家永遠不會被通知有新版。
      # 沉默的失敗只能靠檢查擋。
      - name: version.json 有沒有跟著版本號更新
        run: python tools/check-version.py

      # 涵蓋率表跟進度表一樣是產生的，過期就會變成謊話。
      - name: 涵蓋率表有沒有跟著更新
        run: python tools/coverage.py --check

      - name: 收集站的濾網
        run: node tools/collector/worker.test.mjs

      - name: 顯示翻譯進度
        if: always()
        run: python tools/progress.py
