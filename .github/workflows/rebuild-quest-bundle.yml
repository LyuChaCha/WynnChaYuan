# 任務對話合併成模組讀的那一份。
#
# 為什麼要自動做
# --------------
# 譯者改的是 translations/quest/ 底下一個任務一個檔——那是給人看的形態。
# 模組讀的是合併後的 quest-dialogue.json，因為譯文是啟動時一個一個抓下來的，
# 157 個檔就是 157 次連線。
#
# 但譯者多半在 GitHub 網頁上直接改，手邊沒有 Python，沒辦法自己重新產生。
# 要求他們做，等於把每個翻譯 PR 都變成紅燈——實際發生過。
#
# 所以合併這件事由這裡做：合進 main 之後自動重新產生並提交。
name: 重新產生合併檔與進度表

on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/assets/wynnchayuan/translations/**'
      - 'tools/quest-bundle.py'
      - 'tools/update-docs.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 合併與更新進度表
        run: |
          python tools/quest-bundle.py
          python tools/quest-index.py
          # 進度數字寫死在文件裡就會過期，新來的譯者會照著早就翻完的表去翻
          python tools/update-docs.py

      # main 是受保護分支（要走 PR、要過 validate），直接 push 會被拒絕：
      #   remote: error: GH006: Protected branch update failed
      # 所以這裡推到分支再開 PR。
      - name: 有變動就開 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "沒有變動。"
            exit 0
          fi
          BRANCH="auto/rebuild-${GITHUB_SHA::7}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "重新產生合併檔、認領清單與進度表

          由 rebuild-quest-bundle 工作流程自動提交。"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "重新產生合併檔、認領清單與進度表" \
            --body "由 rebuild-quest-bundle 自動產生。內容全部是產生物：
          quest-dialogue.json、docs/quest-dialogue.md、以及各文件裡的進度數字。"
          # 倉庫沒開自動合併時這行會失敗，那就讓 PR 開著等人合併，
          # 不要因此把整個工作流程變成紅燈。
          gh pr merge "$BRANCH" --squash --auto --delete-branch || true
