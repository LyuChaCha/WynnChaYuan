# 程式改動的 PR 自動編一份 jar，掛在 Actions 那一頁的 Artifacts 下載，給人實機測試。
# 驗證（gradle check）另外跑：沒過照樣上傳 jar，但這個工作會標紅。
name: Build jar

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Wynntils 只編譯時用，jar 不進版控（見 build.gradle）
      - name: Download Wynntils
        run: |
          curl -fsSL -o "libs/wynntils-4.2.8-fabric+MC-1.21.11.jar" \
            "https://github.com/Wynntils/Wynntils/releases/download/v4.2.8/wynntils-4.2.8-fabric%2BMC-1.21.11.jar"

      - name: Build
        run: gradle build -x check --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wynnchayuan-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Checks
        run: gradle check --no-daemon
