# 把收集站累積的缺口撈回來，分類進語料，開一個 PR 等人看過。
#
# 為什麼要有這條
# --------------
# captured.json 只長在玩的人自己那一台。要把一段任務對話收進語料，就得有人
# 真的去把那段任務跑一遍——維護者一個人的遊玩時數，實際上就是翻譯進度的上限。
# 分享出來之後，一百個人各跑各的，語料是所有人的總和。
#
# 為什麼是開 PR 不是直接寫進去
# ----------------------------
# 收集站是公開端點，任何人都送得進東西。開 PR 讓人先看過，最壞情況就是
# 一個 PR 被關掉；直接寫進 main 的話，最壞情況是語料被灌垃圾。
#
# 沒設定 secrets 的話這條會安靜跳過——fork 出去的倉庫不會因此變紅燈。
name: 撈回分享的語料

on:
  schedule:
    - cron: '17 19 * * *'      # 每天台灣時間清晨三點多
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 撈回佇列
        id: drain
        env:
          URL: ${{ secrets.COLLECTOR_URL }}
          TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "沒有設定收集站，跳過。設定方式見 tools/collector/README.md。"
            echo "have=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$URL/drain" -o raw.json
          # 佇列的鍵另外留一份：撈的時候不刪，開完 PR 才回頭刪（見最後一步）。
          # 剩下的部分刻意跟 captured.json 同形，可以直接餵給 import-captured.py。
          COUNT=$(python tools/collector/split-drain.py raw.json inbox.json "$RUNNER_TEMP/ack.json")
          rm -f raw.json
          echo "撈回 $COUNT 條。"
          if [ "$COUNT" -gt 0 ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 分類進語料
        if: steps.drain.outputs.have == 'yes'
        run: |
          # 先修「早就翻好、只是原文差一點」的那些。
          #
          # 任務對話有九成八抓自 wiki，而 wiki 是人打的：標點、省略號的個數、
          # 被連結吃掉的一個字，都會讓查表完全落空——畫面上跟「還沒翻」
          # 一模一樣，所以沒有人會發現那一句其實早就翻好了。實際踩過：
          # 語料裡的 `reach the from this house` 少了一個 rooftops，
          # 那句台詞在遊戲裡一直是英文（2026-09-12 玩家回報）。
          #
          # 這一步拿玩家收到的真實字串把 src 改對。它只動已經有譯文的條目、
          # 只改 src，相似度低於 0.9 或佔位符數量對不上都不寫——剩下的才是
          # 真的新句子，交給下一行。
          python tools/near-miss.py inbox.json --write
          # import-captured.py 自己會擋掉已經翻好的、拆得出來的、以及夾帶個資的。
          # 這是第三道濾網（模組端一道、收集站一道），刻意重複。
          python tools/import-captured.py inbox.json --write
          python tools/quest-bundle.py
          python tools/quest-index.py
          python tools/update-docs.py
          python tools/proofread.py
          # 收進新條目會改變分母，涵蓋率表跟著過期。validate 有一關專門看
          # 這個，漏跑的話 PR 一開出來就是紅的（2026-09-12 #538 踩過）。
          python tools/coverage.py --write
          rm -f inbox.json

      - name: 檢查一次才開 PR
        if: steps.drain.outputs.have == 'yes'
        run: python tools/validate.py

      - name: 開 PR
        if: steps.drain.outputs.have == 'yes'
        env:
          # 有 PAT 就用 PAT：GITHUB_TOKEN 開的 PR 不會觸發 validate，
          # 必要檢查永遠是空的，PR 就永遠合不進去（實際踩過）。
          GH_TOKEN: ${{ secrets.REBUILD_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "撈回來的都已經在語料裡了，沒有變動。"
            exit 0
          fi
          BRANCH="auto/inbox-$(date +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "收進大家分享的待譯字串

          由 collect-inbox 工作流程自動提交，內容是玩家分享回來的缺口，
          dst 全部留空等人翻。"
          git push -u origin "$BRANCH" --force

          BODY="由 collect-inbox 自動產生，全部是 dst 留空的待譯條目。

          合併前請掃一眼有沒有夾帶到玩家名或公會名——三道濾網都過了，但這是最後一次有人看得到的機會。"

          # 已經有一個開著就不是錯誤，直接結束。
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "已經有一個 PR 開著，這次不再開。"
            exit 0
          fi

          # REBUILD_PAT 少了 Pull requests: Read and write 時，createPullRequest 會被
          # 擋下來。先前這裡寫成 `|| echo`，於是<b>整個工作流程照樣是綠的</b>——
          # 分支推上去了、佇列也 ack 掉了，但沒有人知道 PR 沒開成。
          # 2026-09-11 那一輪的 1000 條就是這樣躺在分支上沒人發現。
          if gh pr create --base main --head "$BRANCH" \
               --title "收進大家分享的待譯字串" --body "$BODY"; then
            exit 0
          fi

          echo "::warning::REBUILD_PAT 開不了 PR，改用 GITHUB_TOKEN 再試一次。"
          echo "::warning::用 GITHUB_TOKEN 開的 PR 不會自動跑檢查，合併前請手動觸發。"
          if GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr create --base main --head "$BRANCH" \
               --title "收進大家分享的待譯字串" --body "$BODY"; then
            exit 0
          fi

          echo "::error::PR 開不起來。資料在分支 $BRANCH 上，不會遺失，但要有人手動開 PR。"
          exit 1

      - name: 回報處理完成
        if: steps.drain.outputs.have == 'yes'
        env:
          URL: ${{ secrets.COLLECTOR_URL }}
          TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: |
          # 撈的時候不刪，開完 PR 才刪——中間掛掉的話下一次還撈得到同一批。
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/ack.json" "$URL/ack" || true
